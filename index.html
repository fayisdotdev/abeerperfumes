  <body>

    </main>
    <script>
      window.hallmarkSlots = (slots) => {
        for (const [name, value] of Object.entries(slots)) {
          const slot = document.querySelector(`[data-slot="${name}"]`);
          if (!slot) continue;
          const image = new Image();
          image.src = typeof value === "string" ? value : value.src;
          image.alt = (typeof value === "object" && value.alt) || slot.dataset.alt || "";
          slot.querySelectorAll(":scope > img").forEach((existing) => existing.remove());
          slot.prepend(image);
        }
      };
    </script>
